# The package plus its examples (examples link the package via workspace:* so
# `ai`/`zod` dedupe to a single instance). Only the package is published.
packages:
  - examples

# Approve the esbuild build script (a tsup/vitest dependency) under pnpm v10.
allowBuilds:
  esbuild: true

# nimble-js 1.2.0 (first release with typed per-run skill/use_case controls)
# was freshly published at adoption time; the exact resolution is pinned by
# the lockfile and exercised by the contract suite. Remove the exclusions once
# each version ages past pnpm's release-age gate.
minimumReleaseAgeExclude:
  - '@nimble-way/nimble-js@1.2.0'
