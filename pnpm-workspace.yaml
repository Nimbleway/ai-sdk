# The package plus its examples (examples link the package via workspace:* so
# `ai`/`zod` dedupe to a single instance). Only the package is published.
packages:
  - examples

# Approve the esbuild build script (a tsup/vitest dependency) under pnpm v10.
allowBuilds:
  esbuild: true

# nimble-js 1.1.0 (first release with agents.runs) was freshly published at
# adoption time; the exact resolution is pinned by the lockfile and exercised
# by CI. Remove the entry once the version ages past pnpm's release-age gate.
minimumReleaseAgeExclude:
  - '@nimble-way/nimble-js@1.1.0'
